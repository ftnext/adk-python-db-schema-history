name: Export ADK DB schema

on:
  workflow_dispatch:
    inputs:
      adk_version:
        description: "ADK version to export, for example 1.30.0"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: export-adk-schema
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      ADK_VERSION: ${{ inputs.adk_version }}

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Validate input
        run: |
          if [[ ! "$ADK_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid ADK version: $ADK_VERSION" >&2
            exit 2
          fi

      - name: Install Nix
        uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31.10.6

      - name: Export PostgreSQL schema
        run: nix develop -c bash scripts/export_schema.sh "$ADK_VERSION" postgresql

      - name: Export MySQL schema
        run: nix develop -c bash scripts/export_schema.sh "$ADK_VERSION" mysql

      - name: Summarize schema changes
        run: |
          previous_version="$(
            find schemas -maxdepth 1 -type d -name 'v[0-9]*.[0-9]*.[0-9]*' \
              | sed 's#schemas/v##' \
              | grep -v "^${ADK_VERSION}$" \
              | sort -V \
              | awk -v target="$ADK_VERSION" '$0 < target { previous = $0 } END { print previous }'
          )"

          {
            echo "## ADK schema export"
            echo
            echo "- Exported version: \`v${ADK_VERSION}\`"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -z "$previous_version" ]; then
            {
              echo "- Previous tracked version: none"
              echo
              echo "No previous tracked schema version was found for comparison."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          {
            echo "- Previous tracked version: \`v${previous_version}\`"
            echo
            echo "### Diff check"
          } >> "$GITHUB_STEP_SUMMARY"

          changed=0
          for db in postgresql mysql; do
            if diff -q "schemas/v${previous_version}/${db}.sql" "schemas/v${ADK_VERSION}/${db}.sql" >/dev/null; then
              echo "- \`${db}.sql\`: no schema diff" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "- \`${db}.sql\`: schema diff detected" >> "$GITHUB_STEP_SUMMARY"
              changed=1
            fi
          done

          {
            echo
            if [ "$changed" -eq 1 ]; then
              echo "README.md was not updated automatically. Compare the generated schemas and update README.md manually if this version should be tracked as a schema-changing release."
            else
              echo "No schema diff was detected against the previous tracked version."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload troubleshooting logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: adk-api-logs-${{ inputs.adk_version }}
          path: /tmp/adk_api_${{ inputs.adk_version }}_*.log
          if-no-files-found: ignore

      - name: Upload exported workspace changes
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: exported-adk-schema-${{ inputs.adk_version }}
          path: |
            schemas/v${{ inputs.adk_version }}/

  commit:
    runs-on: ubuntu-latest
    needs: export
    permissions:
      contents: write
    env:
      ADK_VERSION: ${{ inputs.adk_version }}

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Download exported workspace changes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: exported-adk-schema-${{ inputs.adk_version }}
          path: schemas/v${{ inputs.adk_version }}

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "schemas/v${ADK_VERSION}"

          if git diff --cached --quiet; then
            echo "No staged schema or README changes."
            exit 0
          fi

          git commit -m "Add ADK ${ADK_VERSION} DB schemas"
          git push
